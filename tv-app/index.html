<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Casa</title>
<!--
  Caricatore dell'app "Casa" (app separata da TizenBrew).
  Non contiene la schermata: scarica avvio.js da GitHub Pages, che a sua volta
  carica struttura, stile e widget. CASA_STANDALONE dice ai widget che possono
  usare direttamente le API della TV (window.tizen), senza il servizio di TizenBrew.
-->
<style>
  html, body { margin: 0; background: #0b0f17; }
  #stato { position: absolute; top: 50%; left: 0; right: 0; margin-top: -24px;
           text-align: center; color: #9aa4b5; font: 32px/1.4 sans-serif; }
</style>
</head>
<body>
<div id="stato">Caricamento della schermata Casa…</div>
<script>
  var REMOTE_BASE = "https://sherkot.github.io/casa-tv/";
  window.CASA_BASE = REMOTE_BASE;
  window.CASA_STANDALONE = true;

  // Registra i tasti colorati del telecomando (rosso = ricarica, blu = elenco app).
  try {
    ["ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue"].forEach(function (k) {
      try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
    });
  } catch (e) {}

  // Se la rete non risponde (per esempio subito dopo l'accensione), riprova ogni 10 secondi.
  window.CASA_ERRORE = function (motivo) {
    var s = document.getElementById("stato");
    if (!s) {
      document.body.innerHTML = '<div id="stato"></div>';
      s = document.getElementById("stato");
    }
    s.textContent = "In attesa della rete (" + motivo + ")… riprovo tra poco";
    setTimeout(function () { location.reload(); }, 10000);
  };

  var s = document.createElement("script");
  s.src = REMOTE_BASE + "avvio.js?v=" + Date.now();
  s.onerror = function () { window.CASA_ERRORE("avvio.js non raggiungibile"); };
  document.body.appendChild(s);
</script>
</body>
</html>
