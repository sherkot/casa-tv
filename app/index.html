<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Casa</title>
<!--
  Caricatore del modulo TizenBrew "Casa".
  NON va modificato per cambiare la schermata: la schermata vera sta nella cartella
  docs/ del repository ed è pubblicata su GitHub Pages. Questo file scarica da lì
  avvio.js, che a sua volta carica struttura, stile e widget dentro questa pagina.
  Così la schermata può usare le API della TV (aprire app, tasti del telecomando).
  Unico valore da impostare la prima volta: REMOTE_BASE.
-->
<style>
  html, body { margin: 0; background: #0b0f17; }
  #stato { position: absolute; top: 50%; left: 0; right: 0; margin-top: -24px;
           text-align: center; color: #9aa4b5; font: 32px/1.4 sans-serif; }
</style>
</head>
<body>
<div id="stato">Caricamento della schermata Casa…</div>
<script>
  // Indirizzo della schermata pubblicata su GitHub Pages (con la barra finale).
  var REMOTE_BASE = "https://__GITHUB_USER__.github.io/casa-tv/";
  window.CASA_BASE = REMOTE_BASE;

  // Se qualcosa non arriva dalla rete, mostra un messaggio e riprova tra 20 secondi.
  window.CASA_ERRORE = function (motivo) {
    var s = document.getElementById("stato");
    if (!s) {
      document.body.innerHTML = '<div id="stato"></div>';
      s = document.getElementById("stato");
    }
    s.textContent = "In attesa della rete (" + motivo + ")… riprovo tra poco";
    setTimeout(function () { location.reload(); }, 20000);
  };

  // Carica avvio.js da GitHub Pages con un parametro sempre nuovo (niente cache vecchia).
  var s = document.createElement("script");
  s.src = REMOTE_BASE + "avvio.js?v=" + Date.now();
  s.onerror = function () { window.CASA_ERRORE("avvio.js non raggiungibile"); };
  document.body.appendChild(s);
</script>
</body>
</html>
