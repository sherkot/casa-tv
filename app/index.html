<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Casa</title>
<!--
  Caricatore del modulo TizenBrew "Casa".
  Questo file NON va modificato per cambiare la schermata: la schermata vera
  sta nella cartella docs/ del repository ed è pubblicata su GitHub Pages.
  Il caricatore la apre a tutto schermo e la ricarica quando serve.
  Unico valore da impostare: REMOTE_BASE (l'indirizzo GitHub Pages).
-->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0f17; overflow: hidden; }
  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  #stato { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
           text-align: center; color: #9aa4b5; font: 32px/1.4 sans-serif; }
</style>
</head>
<body>
<div id="stato">Caricamento della schermata Casa…</div>
<script>
  // Indirizzo della schermata pubblicata su GitHub Pages (con la barra finale).
  var REMOTE_BASE = "https://__GITHUB_USER__.github.io/casa-tv/";

  var stato = document.getElementById("stato");
  var cornice = null;

  // Registra i tasti colorati del telecomando, se l'API della TV è disponibile.
  try {
    if (window.tizen && tizen.tvinputdevice) {
      ["ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue"].forEach(function (k) {
        try { tizen.tvinputdevice.registerKey(k); } catch (e) {}
      });
    }
  } catch (e) {}

  // Apre (o riapre) la schermata dentro una cornice a tutto schermo.
  // Il parametro v=… evita che la TV usi una copia vecchia dalla cache.
  function apri() {
    if (cornice) { cornice.parentNode.removeChild(cornice); }
    cornice = document.createElement("iframe");
    cornice.src = REMOTE_BASE + "index.html?v=" + Date.now();
    document.body.appendChild(cornice);
  }

  // Prima di aprire controlla che la rete risponda; se no riprova ogni 20 s.
  function prova() {
    var x = new XMLHttpRequest();
    x.open("GET", REMOTE_BASE + "version.json?v=" + Date.now(), true);
    x.timeout = 8000;
    x.onload = function () {
      if (x.status >= 200 && x.status < 400) { stato.style.display = "none"; apri(); }
      else { attendi(); }
    };
    x.onerror = attendi;
    x.ontimeout = attendi;
    x.send();
  }
  function attendi() {
    stato.style.display = "block";
    stato.textContent = "In attesa della rete… riprovo tra poco";
    setTimeout(prova, 20000);
  }

  // Tasto rosso: ricarica la schermata.
  document.addEventListener("keydown", function (e) {
    if (e.keyCode === 403) { apri(); }
  });

  prova();
</script>
</body>
</html>
